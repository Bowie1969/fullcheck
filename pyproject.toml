[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fullcheck"
version = "0.1.0"
description = "Single-operator external attack surface checkup"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "pyyaml>=6",
    "jinja2>=3.1",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
m365 = ["msal>=1.28"]

[project.scripts]
fullcheck = "fullcheck.cli:app"
fcx = "fullcheck.internal.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
