# FullCheck-Internal example scope — copy relevant blocks into your scope.yaml.
#
# Internal engagements add these optional keys to an engagement:
#   autonomy       gated | auto_low | aggressive | auto_lab   (default gated)
#                  auto_lab is FULLY autonomous (FLOOR + post-exploit auto-run) and
#                  works ONLY on an attested owned lab: it requires owned_lab: true
#                  AND a SELF-* auth_ref, else it fails safe to gated. Never valid
#                  on a client engagement. See docs/INTERNAL.md.
#   owned_lab      true only for the operator's own lab (gates auto_lab). Default false.
#   interface      the drop box NIC on the client LAN (used by MITM techniques)
#   zone_ceilings  per-CIDR ceiling overrides — cap fragile subnets below the
#                  engagement ceiling. Enforced by the Dispatcher for BOTH the
#                  swarm and `fcx attack`. Ceiling values: passive|probe|scan|
#                  exploit|post_exploit  (probe == the internal "discovery" tier).
#
# Everything else (auth_ref, ceiling, scope, out_of_scope, rate_limits) is the
# same schema the external tool already uses.

engagements:
  acme-internal:
    auth_ref: NPT-ACME-20260901-001      # must match `fcx ... --auth-ref`
    ceiling: post_exploit                # engagement-wide maximum blast radius
    autonomy: aggressive                 # ceiling-only auto; FLOOR still gates
    interface: eth0                      # drop box NIC facing the client LAN
    scope:
      - 10.10.0.0/16                     # corporate LAN (in scope)
      - 192.168.50.0/24                  # server VLAN
    out_of_scope:
      - 10.10.99.0/24                    # guest wifi — never touch
      - 10.10.13.37                      # the drop box's own address
    zone_ceilings:
      - cidr: 10.10.20.0/24              # OT / SCADA — fragile, discovery only
        ceiling: probe
      - cidr: 10.10.0.10/32              # domain controller — no exploitation
        ceiling: scan

  # Your OWN lab — the only place auto_lab actually lowers the floor. Requires
  # BOTH owned_lab: true AND a SELF-* auth_ref, or it fails safe to gated.
  # `fcx auto home-lab --auth-ref SELF-LAB-20260826-001 --range 192.168.88.0/24`
  # runs the full recon -> LLM-chosen exploit -> post-exploit chain with no
  # per-step confirm. NEVER put a client engagement in this shape.
  home-lab:
    auth_ref: SELF-LAB-20260826-001      # SELF-* → self-authorization
    owned_lab: true                      # explicit owned-lab attestation
    autonomy: auto_lab                   # fully autonomous (FLOOR + post-exploit)
    ceiling: post_exploit                # required for post-exploit to actually run
    interface: enp0s25                   # NIC MITM techniques bind to
    scope:
      - 192.168.88.0/24                  # the lab network you own
    out_of_scope:
      - 192.168.88.1                     # your own gateway/router

rate_limits:
  requests_per_second_per_host: 5
  max_workers: 50
